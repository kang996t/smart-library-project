storage:
  dbPath: /opt/smart-library-b/sharding/configsvr
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5
systemLog:
  destination: file
  path: /opt/smart-library-b/logs/configsvr.log
  logAppend: true
net:
  bindIp: 127.0.0.1
  port: 27219
replication:
  replSetName: configRS
sharding:
  clusterRole: configsvr
security:
  keyFile: /opt/smart-library-b/secrets/sharding.key
  authorization: enabled
processManagement:
  fork: true
  pidFilePath: /opt/smart-library-b/sharding/configsvr/mongod.pid
