systemLog:
  destination: file
  path: /opt/smart-library-b/logs/mongos.log
  logAppend: true
net:
  bindIp: 127.0.0.1
  port: 27200
sharding:
  configDB: configRS/localhost:27219
security:
  keyFile: /opt/smart-library-b/secrets/sharding.key
processManagement:
  fork: true
  pidFilePath: /opt/smart-library-b/mongos.pid
