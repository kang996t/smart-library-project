storage:
  dbPath: /opt/smart-library-b/sharding/shard2
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5
systemLog:
  destination: file
  path: /opt/smart-library-b/logs/shard2.log
  logAppend: true
net:
  bindIp: 127.0.0.1
  port: 27212
replication:
  replSetName: shard2RS
sharding:
  clusterRole: shardsvr
security:
  keyFile: /opt/smart-library-b/secrets/sharding.key
  authorization: enabled
processManagement:
  fork: true
  pidFilePath: /opt/smart-library-b/sharding/shard2/mongod.pid
