storage:
  dbPath: /opt/smart-library-b/replica/node1
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5
systemLog:
  destination: file
  path: /opt/smart-library-b/logs/node1.log
  logAppend: true
net:
  port: 27117
  bindIp: 127.0.0.1
replication:
  replSetName: libraryRS
security:
  keyFile: /opt/smart-library-b/secrets/replica.key
  authorization: enabled
processManagement:
  fork: true
  pidFilePath: /opt/smart-library-b/replica/node1/mongod.pid
